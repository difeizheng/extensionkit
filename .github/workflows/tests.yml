name: tests

on:
  push:
    paths: ['server/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run license server test suite
        working-directory: server
        run: npm test

<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; box-sizing:border-box; }
  body { width:1280px; height:640px; overflow:hidden; font-family:"Segoe UI",system-ui,sans-serif; background:#0b1220; color:#e2e8f0; position:relative; }
  .glow { position:absolute; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle,rgba(37,99,235,.18),transparent 60%); top:-350px; right:-200px; }
  .wrap { position:absolute; inset:0; padding:70px 80px; display:flex; flex-direction:column; }
  .kicker { font-size:15px; letter-spacing:.3em; text-transform:uppercase; color:#60a5fa; font-weight:600; }
  h1 { font-size:64px; margin:14px 0 10px; letter-spacing:-0.02em; }
  .sub { font-size:24px; color:#94a3b8; max-width:820px; }
  .flow { margin-top:44px; display:flex; align-items:center; gap:14px; font:600 17px "Consolas",monospace; }
  .node { background:#111c33; border:1px solid #1e3a5f; border-radius:10px; padding:14px 20px; }
  .arrow { color:#3b82f6; font-size:22px; }
  .badges { margin-top:auto; display:flex; gap:12px; font-size:15px; color:#cbd5e1; }
  .badge { background:#111c33; border:1px solid #1e3a5f; border-radius:999px; padding:8px 18px; }
</style></head><body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="kicker">For indie developers</div>
    <h1>ExtensionKit</h1>
    <div class="sub">Start charging money for your browser extension — license keys, Stripe delivery, offline validation. Zero dependencies, tested end to end.</div>
    <div class="flow">
      <div class="node">Stripe Checkout</div><div class="arrow">→</div>
      <div class="node">License Server</div><div class="arrow">→</div>
      <div class="node">Signed Token</div><div class="arrow">→</div>
      <div class="node">Your Extension</div>
    </div>
    <div class="badges"><span class="badge">MIT core</span><span class="badge">16/16 tests</span><span class="badge">Node built-ins only</span><span class="badge">Pro pack $59</span></div>
  </div>
</body></html>
